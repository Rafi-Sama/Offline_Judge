{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-full max-w-2xl shadow-lg">
        <h1 class="text-3xl font-bold neon-text text-center mb-6">{{ problem.title }}</h1>
        <p class="text-gray-300 mb-6 whitespace-pre-line">{{ description }}</p>

        <a href="{{ url_for('submit', problem_id=problem.id) }}" 
           class="bg-pink-500 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded transition duration-300">
            Submit Solution
        </a>
    </div>
</div>
{% endblock %}
