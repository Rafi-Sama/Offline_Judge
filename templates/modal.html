<!-- Button to Open Modal -->
<button onclick="openModal()" class="bg-blue-500 text-white px-4 py-2 rounded">
    View
</button>

<!-- Modal -->
<div id="submissionModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-1/2">
        <h2 class="text-xl font-bold">Submission History</h2>
        <button onclick="closeModal()" class="absolute top-2 right-2 text-gray-500">&times;</button>

        <!-- Submissions List -->
        <div id="submissionsContainer" class="mt-4 space-y-2">
            <!-- Data will be injected here -->
        </div>

        <button onclick="closeModal()" class="mt-4 bg-gray-500 text-white px-4 py-2 rounded">Close</button>
    </div>
</div>
