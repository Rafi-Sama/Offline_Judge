{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-96 shadow-lg">
        <h1 class="text-3xl font-bold neon-text text-center">Login</h1>
        <form method="POST" class="mt-6">
            <label class="block text-gray-300 mb-2">Username</label>
            <input type="text" name="username" required
                class="w-full p-3 bg-transparent border border-gray-400 rounded-lg focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 outline-none transition">

            <label class="block text-gray-300 mt-4 mb-2">Password</label>
            <input type="password" name="password" required
                class="w-full p-3 bg-transparent border border-gray-400 rounded-lg focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 outline-none transition">

            <button type="submit"
                class="neon-button w-full mt-6">
                Login
            </button>
        </form>
        <p class="mt-4 text-center text-gray-400">Don't have an account? <a href="{{ url_for('register') }}" class="neon-hover">Register</a></p>
    </div>
</div>
{% endblock %}
