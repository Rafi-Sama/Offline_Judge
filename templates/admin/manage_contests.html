{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-full max-w-2xl shadow-lg text-center">
        <h1 class="text-3xl font-bold neon-text mb-6">Manage Contests</h1>

        {% if contests %}
            <ul class="space-y-4">
                {% for contest in contests %}
                    <li class="p-4 rounded-lg bg-gray-800 text-white flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold">{{ contest.name }}</h2>
                            <p class="text-sm">Start: {{ contest.start_time }}</p>
                            <p class="text-sm">End: {{ contest.end_time }}</p>
                        </div>
                        <form method="POST" action="{{ url_for('delete_contest', contest_id=contest.id) }}">
                            <button type="submit"
                                class="p-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition duration-300">
                                Delete
                            </button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="text-gray-400">No contests available.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
