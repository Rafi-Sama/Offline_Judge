{% extends "base.html" %}  {% block content %}
<div class="flex justify-center items-center min-h-[calc(100vh-250px)] py-8 px-4">
    <div class="glass p-6 rounded-lg w-full max-w-3xl shadow-lg border border-gray-700">
        <h1 class="text-2xl font-bold neon-text text-center mb-4">🏆 Manage Contests</h1>
        
        {% if contests %}
        <ul class="space-y-4">
            {% for contest in contests %}
            <li class="p-4 rounded-lg bg-gray-900 text-white shadow-md border border-gray-700 hover:shadow-lg hover:border-gray-600 transition">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-blue-400">{{ contest.name }}</h2>
                    
                    <div class="flex space-x-2">
                        <a href="{{ url_for('manage_problems', contest_id=contest.id) }}" 
                           class="text-white text-sm flex items-center px-3 py-1 rounded-md hover:bg-purple-600 transition">
                            ⚙️ Edit Problems
                        </a>
                        
                        <form method="POST" action="{{ url_for('delete_contest', contest_id=contest.id) }}" 
                              onsubmit="return confirm('Are you sure you want to delete this contest?');">
                            <button type="submit" 
                                    class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white text-sm font-bold rounded-md shadow transition">
                                ❌ Delete
                            </button>
                        </form>
                    </div>
                </div>
                <div class="flex align-center gap-2 mt-2">
                    <p class="mt-2">Change Time :</p> 
                <form method="POST" action="{{ url_for('manage_contests') }}" class="mt-2 flex items-center space-x-2">
                    <input type="hidden" name="contest_id" value="{{ contest.id }}">

                    <label class="text-gray-400 text-xs">📅 Start</label>
                    <input type="datetime-local" name="start_time" value="{{ contest.start_time.strftime('%Y-%m-%dT%H:%M') }}" 
                           class="text-xs text-gray-400 p-1 rounded-md border border-gray-600 focus:ring-2 focus:ring-blue-500 w-[120px]" />
                    
                    <label class="text-gray-400 text-xs">⏳ End</label>
                    <input type="datetime-local" name="end_time" value="{{ contest.end_time.strftime('%Y-%m-%dT%H:%M') }}" 
                           class="text-xs text-gray-400 p-1 rounded-md border border-gray-600 focus:ring-2 focus:ring-blue-500 w-[120px]" />

                    <button type="submit" class="py-1 px-3 bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-bold rounded-md shadow transition">
                        💾 Save
                    </button>
                </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="text-gray-400 text-center text-sm">
            🚀 No contests available. 
            <a href="{{ url_for('add_contest') }}" class="text-cyan-400 hover:text-cyan-300">Create one now!</a>
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}
