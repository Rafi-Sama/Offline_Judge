{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-full max-w-xl shadow-lg text-center">
        <h1 class="text-3xl font-bold neon-text mb-6">Admin Dashboard</h1>
        
        <a href="{{ url_for('add_problem') }}"
            class="block w-full p-4 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-bold transition duration-300 neon-hover">
            Add New Problem
        </a>

        <a href="{{ url_for('manage_problems') }}"
            class="block w-full mt-4 p-4 rounded-lg bg-purple-500 hover:bg-purple-600 text-white font-bold transition duration-300 neon-hover">
            Manage Problems
        </a>

        <a href="{{ url_for('manage_users') }}"
            class="block w-full mt-4 p-4 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold transition duration-300 neon-hover">
            Manage Users
        </a>

        <a href="{{ url_for('manage_submissions') }}"
            class="block w-full mt-4 p-4 rounded-lg bg-yellow-500 hover:bg-yellow-600 text-white font-bold transition duration-300 neon-hover">
            Manage Submissions
        </a>
    </div>
</div>
{% endblock %}
