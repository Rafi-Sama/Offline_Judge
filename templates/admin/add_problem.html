{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-[calc(100vh-250px)] py-8 ">
    <div class="glass p-8 rounded-lg w-full max-w-3xl shadow-lg border border-gray-700">
        <h1 class="text-3xl font-bold neon-text text-center mb-6">🚀 Add a New Problem</h1>
        <form method="POST" id="problem-form">
            <div><label class="block text-gray-300 font-semibold">Title</label>
                <input type="text" name="title" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-gray-300 font-semibold">Time Limit (s)</label>
                    <input type="number" step="0.1" name="time_limit" value="1.0" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div><label class="block text-gray-300 font-semibold">Memory Limit (MB)</label>
                    <input type="number" name="memory_limit" value="256" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>
            <div><label class="block text-gray-300 font-semibold">Description</label>
                <textarea name="description" rows="20" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition"></textarea>
            </div>
            <div><label class="block text-gray-300 font-semibold">Difficulty Level</label>
                <select name="difficulty" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition">
                    <option value="Easy">🟢 Easy</option>
                    <option value="Medium">🟠 Medium</option>
                    <option value="Hard">🔴 Hard</option>
                    <option value="Extreme">⚫ Extreme</option>
                </select>
            </div>
            {% if contest_id %}<p class="text-gray-400 text-center mb-4">Adding problem to Contest ID: {{ contest_id }}</p>{% endif %}
            <div><label class="block text-gray-300 font-semibold">Tags</label>
                <select name="tags[]" required class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition">
                    <option value="brute_force">💪 Brute Force</option>
                    <option value="math">📐 Math</option>
                    <option value="dp">📊 Dynamic Programming</option>
                    <option value="greedy">🤖 Greedy</option>
                    <option value="graph">🕸️ Graphs</option>
                    <option value="sorting">🔀 Sorting</option>
                    <option value="binary_search">🔎 Binary Search</option>
                    <option value="bitwise">🧩 Bitwise</option>
                    <option value="recursion">🔄 Recursion</option>
                </select>
                <small class="text-gray-400">Hold Ctrl (Cmd on Mac) to select multiple tags.</small>
            </div>
            <div id="test-cases-container">
                <label class="block text-gray-300 font-semibold">Test Cases</label>
                <div class="test-case first-test-case">
                    <label class="text-gray-300">Test Input</label>
                    <textarea name="input[]" rows="3" class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition" required></textarea>
                    <label class="text-gray-300">Expected Output</label>
                    <textarea name="output[]" rows="3" class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition" required></textarea>
                    <label class="text-gray-300 flex items-center"><input type="checkbox" name="sample[]" value="0" class="mr-2"> Mark as Sample Test Case</label>
                </div>
            </div>
            <button type="button" id="add-test-case" class="mt-4 p-2 bg-green-600 hover:bg-green-700 text-white rounded font-bold">+ Add Another Test Case</button>
            <button type="submit" class="w-full mt-6 p-3 rounded-lg bg-blue-500 hover:bg-blue-600 text-white font-bold transition duration-300">✙ Add Problem</button>
        </form>
    </div>
</div>

<script>
document.getElementById('add-test-case').addEventListener('click', function () {
    let container = document.getElementById('test-cases-container');
    let testCaseCount = container.getElementsByClassName('test-case').length;
    let newTestCase = document.createElement('div');
    newTestCase.classList.add('test-case', 'mt-4');
    newTestCase.innerHTML = `
        <label class="text-gray-300">Test Input</label>
        <textarea name="input[]" rows="3" class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition" required></textarea>
        <label class="text-gray-300">Expected Output</label>
        <textarea name="output[]" rows="3" class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-blue-500 transition" required></textarea>
        <label class="text-gray-300 flex items-center"><input type="checkbox" name="sample[]" value="${testCaseCount}" class="mr-2"> Mark as Sample Test Case</label>
        <button type="button" class="remove-test-case p-2 bg-red-500 hover:bg-red-600 text-white rounded mt-2 font-bold">Remove</button>
    `;
    container.appendChild(newTestCase);
});

// Delegate event listener to remove test cases dynamically
document.getElementById('test-cases-container').addEventListener('click', function (event) {
    if (event.target.classList.contains('remove-test-case')) {
        let testCases = document.querySelectorAll('.test-case');
        if (testCases.length > 1) {
            event.target.closest('.test-case').remove();
        } else {
            alert('You must have at least one test case.');
        }
    }
});

// Form validation to ensure at least one test case exists before submission
document.getElementById('problem-form').addEventListener('submit', function(event) {
    let testCases = document.querySelectorAll('.test-case');
    if (testCases.length === 0) {
        event.preventDefault();
        alert('You must add at least one test case.');
    }
});
</script>

{% endblock %}
