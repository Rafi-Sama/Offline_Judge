{% extends "base.html" %}

{% block content %}
<div class="text-center mt-16">
    <h1 class="text-4xl font-extrabold neon-text">Submission History</h1>

    <div class="mt-6">
        <label class="flex justify-center items-center space-x-2 cursor-pointer">
            <input type="checkbox" id="mineOnly" class="hidden" onchange="toggleSubmissions()" {% if show_only_mine %}checked{% endif %}>
            <div class="w-6 h-6 border-2 border-cyan-300 rounded-md flex justify-center items-center hover:border-cyan-500 transition">
                <span id="checkbox-icon" class="{% if show_only_mine %}block{% else %}hidden{% endif %} text-cyan-400">✔</span>
            </div>
            <span class="text-cyan-300 neon-hover">Show Only My Submissions</span>
        </label>
    </div>

    <div class="mt-8 mx-auto w-3/4 glass p-6 glow-border">
        <table class="w-full text-gray-300">
            <thead class="text-cyan-400 border-b border-cyan-400">
                <tr>
                    <th class="py-2">ID</th>
                    <th class="py-2">User</th>
                    <th class="py-2">Time</th>
                    <th class="py-2">Problem</th>
                    <th class="py-2">Lang</th>
                    <th class="py-2">Status</th>
                    <!-- <th class="py-2">Exec Time</th>
                    <th class="py-2">Memory</th> -->
                    <th class="py-2">Code</th>
                </tr>
            </thead>
            <tbody>
                {% for sub in submissions %}
                <tr class="border-b border-gray-600 hover:bg-gray-800">
                    <td class="py-2">{{ sub.id }}</td>
                    <td class="py-2">{{ sub.user.username }}</td>
                    <td class="py-2">{{ sub.timestamp }}</td>
                    <td class="py-2">{{ sub.problem.title }}</td>
                    <td class="py-2">{{ sub.language }}</td>
                    <td class="py-2 {% if sub.status == 'Accepted' %}text-green-400{% else %}text-red-400{% endif %}">{{ sub.status }}</td>
                    <!-- <td class="py-2">{{ sub.execution_time }} ms</td>
                    <td class="py-2">{{ sub.memory_used }} KB</td> -->
                    <td class="py-2">
                        <button class="neon-button text-xs px-2 py-1" onclick="toggleCode({{ sub.id }})">View</button>
                        <pre id="code-{{ sub.id }}" class="hidden bg-gray-900 text-gray-300 p-2 mt-2 rounded-md">{{ sub.code }}</pre>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function toggleSubmissions() {
        let url = new URL(window.location.href);
        url.searchParams.set("mine", document.getElementById("mineOnly").checked ? "true" : "false");
        window.location.href = url.toString();
    }

    function toggleCode(id) {
        document.getElementById(`code-${id}`).classList.toggle("hidden");
    }
</script>
{% endblock %}
