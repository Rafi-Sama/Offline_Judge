{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-full max-w-4xl shadow-lg">
        <h1 class="text-3xl font-bold neon-text text-center mb-6">ProblemSet Leaderboard</h1>
        <table class="w-full text-left border-collapse neon-table">
            <thead>
                <tr class="text-gray-300 border-b border-gray-600">
                    <th class="p-3">Rank</th>
                    <th class="p-3">Username</th>
                    <th class="p-3">Problems Solved</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in standings %}
                <tr class="hover:bg-gray-800 transition">
                    <td class="p-3 text-center">{{ loop.index }}</td>
                    <td class="p-3">{{ entry.username }}</td>
                    <td class="p-3 text-center">{{ entry.solved }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
