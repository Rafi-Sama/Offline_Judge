{% extends "base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-screen">
    <div class="glass p-8 rounded-lg w-full max-w-3xl shadow-lg">
        <h1 class="text-3xl font-bold neon-text text-center mb-6">Submit Solution for {{ problem.title }}</h1>
        <form method="POST" class="space-y-6">
            <!-- Language Selection -->
            <label for="language" class="text-gray-300 font-semibold">Choose Language:</label>
            <select name="language" id="language"
                class="w-full p-3 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-pink-500 transition">
                <option value="cpp" selected>C++</option>
                <option value="c">C</option>
                <option value="python">Python</option>
            </select>

            <!-- Code Editor -->
            <textarea name="code" rows="10" required
                class="w-full p-4 rounded-lg bg-gray-900 text-gray-300 border border-gray-700 focus:ring-2 focus:ring-pink-500 transition" placeholder="// Write your C++ code here..."></textarea>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full p-3 rounded-lg bg-pink-500 hover:bg-pink-600 text-white font-bold transition duration-300 neon-hover">
                Submit
            </button>
        </form>
    </div>
</div>
{% endblock %}
